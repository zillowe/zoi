[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    "RUSTSEC-2025-0141", # bincode: unmaintained, transitive via syntect
    # team considers it complete
    "RUSTSEC-2024-0320", # yaml-rust: unmaintained, transitive via syntect
    # see yaml-rust2 fork
    "RUSTSEC-2026-0249", # smartstring: unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "bzip2-1.0.6",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

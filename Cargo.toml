[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/common",
    "crates/cli",
    "crates/mini",
    "crates/purl",
    "crates/resolver",
    "crates/lua",
    "crates/hooks",
    "crates/sandbox",
    "crates/telemetry",
    "crates/project",
    "crates/db",
    "crates/audit",
    "crates/dependencies",
    "crates/install",
    "crates/package",
    "crates/sync",
    "crates/uninstall",
    "crates/transaction",
    "crates/plugins",
    "crates/daemon",
    "crates/system",
    "crates/tests",
    "crates/zoi-rs",
]
default-members = ["crates/zoi-rs"]

[workspace.package]
version = "1.27.0-dev"
edition = "2024"
rust-version = "1.93.0"
description = "Advanced Package Manager & Environment Orchestrator"
license = "Apache-2.0"
repository = "https://gitlab.com/zillowe/zillwen/zusty/zoi"
homepage = "https://zillowe.qzz.io/zds/zoi"
documentation = "https://docs.rs/zoi-rs/latest/zoi"
keywords = ["cli", "package-manager", "dev-tools", "universal", "environment"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[workspace.lints.rust]
unreachable_pub = "warn"
missing_docs = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "deny"
undocumented_unsafe_blocks = "deny"

unwrap_used = "deny"
todo = "deny"
indexing_slicing = "warn"

cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
explicit_iter_loop = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
naive_bytecount = "warn"

pedantic = { level = "warn", priority = -1 }
too_many_arguments = "allow"
type_complexity = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
ref_option = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

[workspace.dependencies]
anyhow = "1.0.104"
elb = "0.4.0"
chrono = { version = "0.4.45", default-features = false, features = [
    "serde",
    "clock",
    "std",
] }
clap = { version = "4.6.6", features = ["derive", "color"] }
clap_complete = "4.6.9"
colored = "3.1.1"
comfy-table = "8.0.0"
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs = "6.0.0"
flate2 = "1.1.10"
fs2 = "0.4.3"
git2 = { version = "0.21.0", default-features = false, features = [
    "https",
    "vendored-openssl",
] }
hex = "0.4.3"
home = "0.5.12"
indicatif = "0.18.6"
junction = "2.0.0"
mlua = { version = "0.12.1", default-features = false, features = [
    "luau",
    "serde",
] }
nix = { version = "0.31.3", default-features = false, features = [
    "user",
    "fs",
    "signal",
    "process",
] }
openssl = { version = "0.10.81", default-features = false, features = [
    "vendored",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
self-replace = "1.5.0"
semver = "1.0.28"
sequoia-openpgp = { version = "2.4.1", default-features = false, features = [
    "crypto-openssl",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.11.0"
zbsdiff = "1.5.4"
spdx = "0.13.5"
syntect = "5.3.0"
tar = { version = "0.4.46", features = ["xattr"] }
tempfile = "3.27.0"
toml = "1.1.5"
urlencoding = "2.1.3"
uuid = { version = "1.26.0", default-features = false, features = ["v7"] }
walkdir = "2.5.0"
winapi = { version = "0.3.9", default-features = false, features = [
    "securitybaseapi",
    "winnt",
] }
xz2 = "0.1.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"
ar = "0.9.0"
sevenz-rust2 = "0.22.2"
phf = "0.14.0"
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
] }
glob = "0.3.4"
pubgrub = "0.4.0"
thiserror = "2.0.20"
rustc-hash = "2.1.3"
json5 = "1.3.1"
purl = "0.1.6"
dotenvy = "0.15.7"

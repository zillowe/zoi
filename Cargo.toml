aes-gcm = "0.11.1"
rand = { version = "0.10.2", features = ["std", "thread_rng", "sys_rng"] }
getrandom = "0.4.3"
argon2 = "0.6.0"
base64 = "0.23.1"

zoi-common = { path = "crates/common", version = "1.27.0-dev" }
zoi-core = { path = "crates/core", version = "1.27.0-dev" }
zoi-hooks = { path = "crates/hooks", version = "1.27.0-dev" }
zoi-lua = { path = "crates/lua", version = "1.27.0-dev" }
zoi-purl = { path = "crates/purl", version = "1.27.0-dev" }
zoi-resolver = { path = "crates/resolver", version = "1.27.0-dev" }
zoi-sandbox = { path = "crates/sandbox", version = "1.27.0-dev" }
zoi-telemetry = { path = "crates/telemetry", version = "1.27.0-dev" }
zoi-project = { path = "crates/project", version = "1.27.0-dev" }
zoi-cli = { path = "crates/cli", version = "1.27.0-dev" }
zoi-db = { path = "crates/db", version = "1.27.0-dev" }
zoi-audit = { path = "crates/audit", version = "1.27.0-dev" }

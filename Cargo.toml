zoi-install = { path = "crates/install", version = "1.27.0-dev" }
zoi-package = { path = "crates/package", version = "1.27.0-dev" }
zoi-sync = { path = "crates/sync", version = "1.27.0-dev" }
zoi-uninstall = { path = "crates/uninstall", version = "1.27.0-dev" }
zoi-transaction = { path = "crates/transaction", version = "1.27.0-dev" }
zoi-plugins = { path = "crates/plugins", version = "1.27.0-dev" }
zoi-daemon = { path = "crates/daemon", version = "1.27.0-dev" }

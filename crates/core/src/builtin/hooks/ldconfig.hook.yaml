name: ldconfig
description: Configuring dynamic linker run-time bindings...
platforms: ["linux"]
trigger:
  dirs: ["${usrroot}/usr/lib"]
  paths:
    [
      "${usrroot}/etc/ld.so.conf",
      "${usrroot}/etc/ld.so.conf.d/*",
      "${usrroot}/usr/lib/ld.so.conf.d/*",
    ]
  operation: ["install", "upgrade", "remove"]
action:
  when: PostTransaction
  exec: "/usr/bin/ldconfig -r /"

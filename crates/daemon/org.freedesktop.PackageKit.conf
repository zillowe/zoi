<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for zoid's PackageKit interface, installed to
  /usr/share/dbus-1/system.d/. Without it the bus refuses to let zoid own
  org.freedesktop.PackageKit, even as root. Same rules as upstream
  PackageKit's policy: only root may own the name, and anyone may call it;
  zoid authorizes each change with polkit (root callers are allowed).
-->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.PackageKit"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.freedesktop.PackageKit"
           send_interface="org.freedesktop.PackageKit"/>
    <allow send_destination="org.freedesktop.PackageKit"
           send_interface="org.freedesktop.PackageKit.Transaction"/>
    <allow send_destination="org.freedesktop.PackageKit"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.freedesktop.PackageKit"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.PackageKit"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
